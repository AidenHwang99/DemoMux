<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DemoMux 示例</title>
<style>
  :root { color-scheme: dark; font: 16px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; }
  body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #151013; color: #f7eff2; }
  main { box-sizing: border-box; width: min(92%, 640px); padding: clamp(26px, 6vw, 56px); border: 1px solid #513038; border-radius: 24px; background: #21191d; }
  span { color: #ff667e; font-weight: 600; }
  h1 { margin: 8px 0 16px; font-size: clamp(38px, 8vw, 62px); line-height: 1.1; letter-spacing: -.04em; }
  p { margin: 0; color: #d8c7cc; }
</style>
</head>
<body>
<main>
  <span>内置示例</span>
  <h1>DemoMux</h1>
  <p>预览服务正在运行。要展示自己的项目，请先启动项目，再到 DemoMux 切换到它的本机端口。</p>
</main>
</body>
</html>
