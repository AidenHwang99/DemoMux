name: Windows 0.3.2 release
on:
  push:
    branches: [windows/0.3.2]
    paths: [DemoMuxWindows/release.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-0.3.2-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Build, verify and publish Windows trial
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./DemoMuxWindows/publish-windows.ps1
